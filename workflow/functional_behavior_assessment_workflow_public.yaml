    settings:
      code: "import json\n\ndef main(params):\n    # ① 默认值\n    default_re_score = [0] * 13\n    default_re_add_behavior =\
        \ [\"\"] * 13\n    default_re_add_reaction = [\"\"] * 13\n    default_re_2 = [1, 2]\n\n    # ② 取入参\n    re_score_str\
        \ = params.get('re_score', '')\n    re_add_behavior_str = params.get('re_add_behavior', '')\n    re_add_reaction_str\
        \ = params.get('re_add_reaction', '')\n    re_2_str = params.get('re_2', '')\n\n    # ③ 尝试转换 re_score，如果失败或不符合要求就用默认值\n\
        \    try:\n        re_score_list = json.loads(re_score_str)\n        # 必须是列表且长度为 13\n        if not isinstance(re_score_list,\
        \ list) or len(re_score_list) != 13:\n            raise ValueError(\"re_score length error\")\n        # 尝试转为 int\n\
        \        re_score_list = [int(x) for x in re_score_list]\n    except Exception:\n        re_score_list = default_re_score\n\
        \n    # ④ 尝试转换 re_add_behavior，如果失败或不符合要求就用默认值\n    try:\n        re_add_behavior_list = json.loads(re_add_behavior_str)\n\
        \        # 必须是列表且长度为 13\n        if not isinstance(re_add_behavior_list, list) or len(re_add_behavior_list) != 13:\n\
        \            raise ValueError(\"re_add_behavior length error\")\n        # 统一转为字符串\n        re_add_behavior_list =\
        \ [str(x) for x in re_add_behavior_list]\n    except Exception:\n        re_add_behavior_list = default_re_add_behavior\n\
        \n    # ⑤ 尝试转换 re_add_reaction，如果失败或不符合要求就用默认值\n    try:\n        re_add_reaction_list = json.loads(re_add_reaction_str)\n\
        \        # 必须是列表且长度为 13\n        if not isinstance(re_add_reaction_list, list) or len(re_add_reaction_list) != 13:\n\
        \            raise ValueError(\"re_add_reaction length error\")\n        # 统一转为字符串\n        re_add_reaction_list =\
        \ [str(x) for x in re_add_reaction_list]\n    except Exception:\n        re_add_reaction_list = default_re_add_reaction\n\
        \n    # ⑥ 尝试转换 re_2，如果失败或不符合要求就用默认值\n    try:\n        re_2_list = json.loads(re_2_str)\n        # 必须是列表\n       \
        \ if not isinstance(re_2_list, list):\n            raise ValueError(\"re_2 length error\")\n        # 尝试转为 int\n \
        \       re_2_list = [int(x) for x in re_2_list]\n    except Exception:\n        re_2_list = default_re_2\n\n    #\
        \ ⑦ 组织输出\n    output_object = {\n        \"re_score_list\": re_score_list,              # 13 个整数\n        \"re_add_behavior_list\"\
        : re_add_behavior_list, # 13 个字符串\n        \"re_add_reaction_list\": re_add_reaction_list, # 13 个字符串\n        \"re_2_list\"\
        : re_2_list                        # 2 个整数\n    }\n    return output_object\n"
