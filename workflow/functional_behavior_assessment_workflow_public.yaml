    settings:
      code: "def main(params):\n    # 创建一个字典作为输出变量\n    output_object = {\n        \"unfilled_fields\": \"\"  # 改为字符串\n  \
        \  }\n    \n    # 获取6个独立变量\n    gender = params.get('gender', '')\n    age = params.get('age', 0)\n    diagnosis_report\
        \ = params.get('diagnosis_report', '')\n    trigger_situation = params.get('trigger_situation', '')\n    behavior\
        \ = params.get('behavior', '')\n    frequency = params.get('frequency', '')\n    \n    # 定义变量与对应字段的映射\n    fields\
        \ = [\n        {'value': gender, 'name': '学生性别', 'type': 'string'},\n        {'value': age, 'name': '学生年龄', 'type':\
        \ 'age'},\n        {'value': diagnosis_report, 'name': '学生的诊断报告（如果有）', 'type': 'string'},\n        {'value': behavior,\
        \ 'name': '问题行为表现', 'type': 'string'},\n        {'value': trigger_situation, 'name': '问题行为的触发情境', 'type': 'string'},\n\
        \        {'value': frequency, 'name': '问题行为的发生频率', 'type': 'string'}\n    ]\n    \n    # 找到前两个未填写的字段\n    unfilled_list\
        \ = []\n    unfilled_count = 0\n    \n    for field in fields:\n        is_unfilled = False\n        \n        # 根据字段类型判断是否未填写\n\
        \        if field['type'] == 'string':\n            # 字符串变量：空字符串时视为未填写\n            is_unfilled = field['value'] ==\
        \ ''\n        elif field['type'] == 'age':\n            # 年龄变量：小于等于0时视为未填写\n            is_unfilled = field['value']\
        \ <= 0\n        \n        if is_unfilled:\n            unfilled_list.append(field['name'])\n            unfilled_count\
        \ += 1\n            if unfilled_count == 2:\n                break\n    \n    # 将列表转换为字符串，每个字段分行\n    output_object[\"\
        unfilled_fields\"] = '\\n'.join(unfilled_list)\n    \n    return output_object\n"
