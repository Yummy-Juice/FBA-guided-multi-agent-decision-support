public_release:
  schema: fba_workflow_public_blueprint/v1
  generated_date: '2026-08-16'
  deployable: false
  source_format: Baidu AppBuilder workflow export
  purpose: Public documentation of the research workflow structure and prompt/code logic.
  redactions:
  - signed asset URLs and live share links
  - application, workflow, node, port, and deployment identifiers
  - platform editor metadata and duplicated rich-text templates
  - model service endpoints and deployment-specific model identifiers
  - unreferenced test variables
  safety_boundary:
    intended_use: Research documentation and code review only.
    not_a:
    - medical or clinical diagnosis
    - treatment or crisis-management service
    - autonomous or final high-stakes decision tool
    - replacement for educator or qualified professional review
    review_required: Educators and, when appropriate, qualified professionals must review every hypothesis and recommendation.
    risk_escalation: Self-harm, harm-to-others, or other serious-risk indications require immediate escalation under the responsible
      institution's procedures.
    privacy: Do not place names, school identifiers, raw child narratives, chat logs, access keys, or signed URLs in this
      public file.
application:
  name: FBA-guided behavior-assessment decision-support workflow
  description: 本访谈表旨在通过结构化提问，了解学生问题行为的背景、触发因素及潜在功能，以制定针对性干预方案。
  export_version: 3.4.9
  platform_configuration:
    provider: redacted
    endpoint: ${MODEL_ENDPOINT}
    model: ${MODEL_ID}
    retrieval_corpus: Not included in this public snapshot.
  memory_variables:
  - name: bg_score
    description: 背景信息得分
    entity_life_cycle: user
  - name: stage
    description: 阶段
    entity_life_cycle: user
  - name: basic
    description: 基本信息
    entity_life_cycle: user
  - name: bg_add
    description: 背景信息额外问题
    entity_life_cycle: user
  - name: bg_2
    description: 背景信息回答问题
    entity_life_cycle: user
  - name: re_score
    description: 行为反应得分
    entity_life_cycle: user
  - name: re_add_behavior
    description: 行为反应行为
    entity_life_cycle: user
  - name: re_add_reaction
    description: 行为反应反应
    entity_life_cycle: user
  - name: re_2
    description: 行为反应回答问题
    entity_life_cycle: user
  - name: po_score
    description: 积极策略得分
    entity_life_cycle: user
  - name: po_add
    description: 积极策略额外问题
    entity_life_cycle: user
  - name: po_2
    description: 积极策略回答问题
    entity_life_cycle: user
  - name: un
    description: 是否进入到反馈生成阶段
    entity_life_cycle: user
workflow:
  history_chat_rounds: 2
  global_config:
    backup_reply:
      chat:
        additional_requirements: ''
        character_style: 你是一位客服人员，善于耐心友好地回复用户的问题
        enable_reasoning_visible: false
        max_output_tokens: 2048
        model_id: ${MODEL_ID}
        model_name: ${MODEL_NAME}
        model_url: ${MODEL_ENDPOINT}
        model_value: ${MODEL_ID}
        reasoning_model: false
        temperature: 0.0001
        top_p: 0.0001
        web_search:
          enable: false
      knowledge:
        datasets: []
        enable_reasoning_visible: false
        max_output_tokens: 1024
        metadata_filters:
          condition: or
          filters: []
          tag_filters: []
        model_id: ${MODEL_ID}
        model_name: ${MODEL_NAME}
        model_url: ${MODEL_ENDPOINT}
        model_value: ${MODEL_ID}
        reasoning_model: false
        scoring_threshold: 0.01
        strategy: mixed_retrieval
        temperature: 0.0001
        top_k: 6
        top_p: 0.0001
        web_search:
          enable: false
    history_chat_rounds: 2
  nodes:
  - id: node_001
    type: start
    name: 开始
    inputs: []
    outputs: []
  - id: node_002
    type: end
    name: 结束
    inputs:
    - name: result1
      type: string
      required: false
    - name: output
      type: string
      required: false
    outputs: []
    settings:
      content: '{{result1}}{{output}}'
      streaming: false
      terminate_plan: template
  - id: node_003
    type: llm
    name: 基本信息模块
    inputs:
    - name: user_input
      type: string
      required: true
    - name: basic
      type: string
      required: true
    - name: reply
      type: string
      required: true
    outputs:
    - name: gender
      type: string
      required: false
      description: 学生性别：字符串，学生的性别。男性为"男"，女性为"女"，如果没有相关信息，返回""。
    - name: age
      type: number
      required: false
      description: 学生年龄：整数，学生的年龄。如果没有相关信息，返回0。
    - name: diagnosis_report
      type: string
      required: false
      description: 医学诊断报告：字符串，学生的医学诊断报告，如果没有学生没有诊断报告，返回"无"；如果还没有问到该点，返回空字符串""
    - name: behavior
      type: string
      required: false
      description: 问题行为表现：字符串，该学生的问题行为具体表现，如果未记录，返回空字符串""
    - name: trigger_situation
      type: string
      required: false
      description: 问题行为的触发情境：字符串，该学生发生问题行为时的情境，如果未记录，返回空字符串""
    - name: frequency
      type: string
      required: false
      description: 问题行为发生的频率：字符串，该学生问题行为发生的频率，如果未记录，返回空字符串""
    settings:
      max_output_tokens: 32768
      model_id: ${MODEL_ID}
      model_name: ${MODEL_NAME}
      model_type: common
      model_url: ${MODEL_ENDPOINT}
      model_value: ${MODEL_ID}
      multimodal_model: false
      prompt: '你是一个FBA指导的教育决策支持助手，正在系统化地向老师收集一位学生的信息，以描述其基本情况，并对问题行为进行清晰、可操作的界定。目前你进入到了 “基本信息与问题界定” 阶段。在该阶段，你的任务是：收集学生的基本信息，并基于访谈内容，对其问题行为进行具体、可观察的描述，而非分析原因或判断行为功能。请根据你与老师的访谈记录，判断访谈中是否涉及以下基本信息；如有涉及，请你仅基于老师回答中的内容进行整理与概括。


        【基本信息】：

        学生性别

        学生年龄

        学生的诊断报告（如果有）

        问题行为的具体表现

        问题行为的触发情境

        问题行为的发生频率


        【要求】：

        - 在原先已填写的基本信息基础上，对未填写的内容进行补充

        - 不得删除或否定原先已填写且明确的信息；如原信息表述较为模糊，可在不改变原意的前提下补充细节

        - 内容需高度概括，单项字数不超过 70 字

        - 问题行为表现必须为具体、可观察、可描述的动作或语言

        - 不记录“不乖”“不听话”“态度差”等模糊或评价性词汇

        - 若问题行为描述无法明确具体行为表现，视为模糊，不记录任何内容

        - 仅记录访谈中明确提到的内容，不得产生任何“幻觉”

        - 本任务为信息抽取与行为界定任务，不进行原因分析或功能判断


        【输出参数】：

        - 学生性别：字符串，学生的性别。男性为"男"，女性为"女"，如果没有相关信息，返回空字符串""

        - 学生年龄：整数，学生的年龄。如果没有相关信息，输出整数0

        - 医学诊断报告：字符串，学生的医学诊断报告，如果没有学生没有诊断报告，返回"无"；如果还没有问到该点，返回空字符串""

        - 问题行为表现：字符串，该学生的问题行为具体表现，如果未记录或较为模糊，返回空字符串""

        - 问题行为的触发情境：字符串，该学生发生问题行为时的情境，如果未记录，返回空字符串""

        - 问题行为发生的频率：字符串，该学生问题行为发生的频率，如果未记录，返回空字符串""


        【原先的基本信息】：

        {{basic}}


        【你的问题】：

        {{reply}}


        【老师的回答】：

        {{user_input}}'
      reasoning_model: false
      system: '你始终以FBA指导的教育决策支持助手身份进行思考与回应。

        以可观察的行为与环境互动为核心视角

        优先描述事实，避免心理动机、性格或意图推断

        不补全未提供信息，证据不足时保持不确定

        使用专业、冷静、非评价性语言

        不使用标签化、道德化表述

        不进行临床诊断或越权判断

        明确区分观察、事实与假设

        尊重学生隐私与职业伦理

        行为准则：描述先于解释，证据先于判断，支持先于控制'
      temperature: 0.0001
      top_p: 0.0001
      web_search:
        enable: false
  - id: node_004
    type: memory
    name: 初始读取
    inputs:
    - name: stage
      type: string
      required: true
      literal_value: stage
    - name: basic
      type: string
      required: true
      literal_value: basic
    - name: bg_score
      type: string
      required: true
      literal_value: bg_score
    - name: bg_add
      type: string
      required: true
      literal_value: bg_add
    - name: bg_2
      type: string
      required: true
      literal_value: bg_2
    - name: re_score
      type: string
      required: true
      literal_value: re_score
    - name: re_add_behavior
      type: string
      required: true
      literal_value: re_add_behavior
    - name: re_add_reaction
      type: string
      required: true
      literal_value: re_add_reaction
    - name: re_2
      type: string
      required: true
      literal_value: re_2
    - name: po_score
      type: string
      required: true
      literal_value: po_score
    - name: po_add
      type: string
      required: true
      literal_value: po_add
    - name: po_2
      type: string
      required: true
      literal_value: po_2
    - name: un
      type: string
      required: true
      literal_value: un
    outputs:
    - name: stage
      type: string
      required: false
    - name: basic
      type: string
      required: false
    - name: bg_score
      type: string
      required: false
    - name: bg_add
      type: string
      required: false
    - name: bg_2
      type: string
      required: false
    - name: re_score
      type: string
      required: false
    - name: re_add_behavior
      type: string
      required: false
    - name: re_add_reaction
      type: string
      required: false
    - name: re_2
      type: string
      required: false
    - name: po_score
      type: string
      required: false
    - name: po_add
      type: string
      required: false
    - name: po_2
      type: string
      required: false
    - name: un
      type: string
      required: false
    settings:
      mod: read
  - id: node_005
    type: code
    name: 阶段转整数
    inputs:
    - name: stage
      type: string
      required: true
    outputs:
    - name: stage
      type: number
      required: false
    settings:
      code: "def main(params):\n    # 创建一个字典作为输出变量\n    output_object = {}\n    \n    # 将字符串数字转换为整数，如果无法转换则输出0\n    try:\n\
        \        output_object[\"stage\"] = int(params['stage'])\n    except (ValueError, KeyError):\n        output_object[\"\
        stage\"] = 0\n    \n    # 返回输出字典\n    return output_object"
      language: Python
  - id: node_006
    type: llm
    name: 生活背景评分
    inputs:
    - name: q1
      type: string
      required: true
    - name: user_input
      type: string
      required: true
    - name: reply
      type: string
      required: true
    - name: q2
      type: string
      required: true
    outputs:
    - name: score_1
      type: integer
      required: false
      description: 题目1得分
    - name: additional_1
      type: string
      required: false
      description: 额外题目1答案。对于没有答案的题目，返回空字符串""
    - name: score_2
      type: integer
      required: false
      description: 题目2得分
    - name: additional_2
      type: string
      required: false
      description: 额外题目2答案。对于没有答案的题目，返回空字符串""
    - name: output
      type: string
      required: false
      description: 原因解释，解释这么填写的原因
    settings:
      max_output_tokens: 32768
      model_id: ${MODEL_ID}
      model_name: ${MODEL_NAME}
      model_type: common
      model_url: ${MODEL_ENDPOINT}
      model_value: ${MODEL_ID}
      multimodal_model: false
      prompt: '以下是另一个FBA指导的教育决策支持助手正在系统化的向老师收集一位问题学生的信息，以分析他产生问题行为的成因与功能。 现在他们进入到了“生活背景”阶段，在该阶段下你需要收集可能影响学生行为的健康、家庭、环境等信息。请你根据FBA指导的教育决策支持助手与老师的访谈记录，判断访谈中是否涉及到了以下生活背景问题，如果有涉及，请你根据描述的情况打分。若题目存在额外问题，你还要收集额外问题的答案。


        【生活背景问题】：

        - 题目1：{{q1}}

        - 题目2：{{q2}}


        【要求】：

        - 你的任务是信息抽取与规则判断，而非原因分析或主观解释

        - 根据老师回答中的明确描述进行判断与评分，不得产生任何“幻觉”

        - 当老师明确表示不知道答案时，视为未观察到该问题，默认该学生不存在题目所描述的问题，评分为1或2

        - 当题目存在额外问题时，还要填写额外问题的答案

        - 额外问题只能填写访谈中明确提到的内容，不得产生任何“幻觉”

        - 额外问题的答案需高度概括，字数不超过 30 字

        - 当提供的题目已经有得分时，保持原得分不变，仅补充该题目的额外问题答案

        - 必须对每一道生活背景问题分别给出评分结果


        【FBA指导的教育决策支持助手的提问方式】：

        {{reply}}


        【老师的回答】：

        {{user_input}}

        '
      reasoning_model: false
      system: '你始终以FBA指导的教育决策支持助手身份进行思考与回应。

        以可观察的行为与环境互动为核心视角

        优先描述事实，避免心理动机、性格或意图推断

        不补全未提供信息，证据不足时保持不确定

        使用专业、冷静、非评价性语言

        不使用标签化、道德化表述

        不进行临床诊断或越权判断

        明确区分观察、事实与假设

        尊重学生隐私与职业伦理

        行为准则：描述先于解释，证据先于判断，支持先于控制'
      temperature: 0.0001
      top_p: 0.0001
      web_search:
        enable: false
  - id: node_007
    type: memory
    name: 进入2阶段
    inputs:
    - name: stage
      type: string
      required: true
      literal_value: '2'
    outputs:
    - name: isSuccess
      type: boolean
      required: true
    - name: stage
      type: string
      required: false
    settings:
      mod: write
  - id: node_008
    type: switch
    name: 分支器_1
    inputs:
    - {}
    outputs: []
