        \ po_2 = params.get('po_2', [1, 2])\n    while len(po_2) < 2:\n        po_2.append(1)\n    \n    # 定义题目与po_add索引的映射关系\n\
        \    # 题号：po_add索引（只有有额外问题的题目才有映射）\n    question_to_add_index = {\n        4: 0,   # 问题4 -> po_add[0]\n        5:\
        \ 1,   # 问题5 -> po_add[1]\n        6: 2,   # 问题6 -> po_add[2]\n        7: 3,   # 问题7 -> po_add[3]\n        8: 4, \
        \  # 问题8 -> po_add[4]\n        9: 5    # 问题9 -> po_add[5]\n    }\n    \n    # ✅ 更稳的\"空值判断\"（避免 ' ', None, 'null' 等误覆盖）\n\
        \    def is_blank(x) -> bool:\n        if x is None:\n            return True\n        if isinstance(x, str):\n  \
        \          s = x.strip()\n            return s == \"\" or s.lower() in (\"null\", \"none\", \"undefined\")\n     \
        \   return False\n    \n    # 创建po_score和po_add的副本用于更新\n    new_po_score = po_score[:]\n    new_po_add = po_add[:]\n\
