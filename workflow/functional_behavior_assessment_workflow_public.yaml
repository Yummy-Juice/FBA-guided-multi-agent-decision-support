    settings:
      code: "def main(params):\n    # 创建一个字典作为输出变量\n    output_object = {\n        \"bg_score\": [],\n        \"bg_add\":\
        \ [],\n        \"bg_score_str\": \"\",\n        \"bg_add_str\": \"\"\n    }\n    \n    # 获取输入数据\n    score_1 = params.get('score_1',\
        \ 0)\n    score_2 = params.get('score_2', 0)\n    additional_1 = params.get('additional_1', '')\n    additional_2\
