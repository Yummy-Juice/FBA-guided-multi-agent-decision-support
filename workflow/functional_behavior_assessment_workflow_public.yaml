      required: true
    outputs:
    - name: question_1
      type: string
      required: false
    - name: question_2
      type: string
      required: false
    settings:
      code: "import json\n\ndef main(params):\n    # 创建一个字典作为输出变量\n    output_object = {\n        \"question_1\": \"\",\n\
        \        \"question_2\": \"\"\n    }\n    \n    # 获取输入数据\n    scores = params.get('bg_score', [])\n    # 确保scores数组至少有11个元素，不足的用0补充\n\
        \    while len(scores) < 11:\n        scores.append(0)\n    \n    # ① 默认值\n    default_bg_2 = [1, 2]  # 改为 [1, 2]\
        \ 更合理\n\n    # ② 取入参\n    bg_2_raw = params.get('bg_2', '')\n\n    # ③ 尝试转换 bg_2\n    try:\n        # 如果 bg_2 已经是列表，直接使用\n\
        \        if isinstance(bg_2_raw, list):\n            bg_2 = [int(x) for x in bg_2_raw]\n        # 如果是字符串，尝试 JSON 解析\n\
        \        elif isinstance(bg_2_raw, str) and bg_2_raw:\n            bg_2 = json.loads(bg_2_raw)\n            if not\
        \ isinstance(bg_2, list):\n                raise ValueError(\"bg_2 must be a list\")\n            bg_2 = [int(x) for\
        \ x in bg_2]\n        else:\n            bg_2 = default_bg_2\n    except Exception:\n        bg_2 = default_bg_2\n\
        \n    # 确保bg_2至少有2个元素\n    while len(bg_2) < 2:\n        bg_2.append(1)\n    \n    # 定义所有问题的模板\n    questions = [\n\
        \        {\n            \"title\": \"- 该学生的总体健康状况与其他学生相比如何？\",\n            \"options\": \"1.更糟 2.差一点 3.差不多 4.好一点\
        \ 5.更好\",\n            \"has_additional\": False,\n            \"additional_condition\": None,\n            \"additional_question\"\
        : \"\"\n        },\n        {\n            \"title\": \"- 该学生行为受其情绪的影响程度有多大？\",\n            \"options\": \"1.一点也不\
        \ 2.有一点点 3.有点 4.有些 5.非常大\",\n            \"has_additional\": True,\n            \"additional_condition\": 3,\n   \
        \         \"additional_question\": \"额外问题（得分大于等于3时）：孩子情绪不佳时行为是否更好或更差？\"\n        },\n        {\n            \"title\"\
        : \"- 该学生的饮食与其他孩子相比如何？\",\n            \"options\": \"1.更糟 2.有点糟 3.差不多 4.好一点 5.更好\",\n            \"has_additional\"\
        : False,\n            \"additional_condition\": None,\n            \"additional_question\": \"\"\n        },\n   \
        \     {\n            \"title\": \"- 该学生的饮食在多大程度上影响他的行为？\",\n            \"options\": \"1.很多 2.有些 3.有点 4.有一点点 5.很少\"\
        ,\n            \"has_additional\": True,\n            \"additional_condition\": 3,\n            \"additional_question\"\
        : \"额外问题（得分大于等于3时）：学生的饮食较少影响他行为的原因是？\"\n        },\n        {\n            \"title\": \"- 该学生的睡眠时间与班上的其他同学相比如何？\"\
        ,\n            \"options\": \"1.多很多 2.多一点 3.差不多 4.少一点 5.少很多\",\n            \"has_additional\": False,\n         \
        \   \"additional_condition\": None,\n            \"additional_question\": \"\"\n        },\n        {\n          \
        \  \"title\": \"- 该学生的行为会受到他或她睡眠量的影响吗？\",\n            \"options\": \"1.不会 2.会\",\n            \"has_additional\"\
        : True,\n            \"additional_condition\": 2,\n            \"additional_question\": \"额外问题（得分等于2时）：孩子的睡眠量具体是如何影响他的行为的？\"\
        \n        },\n        {\n            \"title\": \"- 该学生是否因遭受虐待而影响了他/她在学校的行为？\",\n            \"options\": \"1.否 2.是\"\
        ,\n            \"has_additional\": True,\n            \"additional_condition\": 2,\n            \"additional_question\"\
        : \"额外问题（得分等于2时）：该学生因遭受虐待而影响了他/她在学校的行为的原因是？\"\n        },\n        {\n            \"title\": \"- 该学生是否因父母健康问题而影响了他/她在学校的行为？\"\
        ,\n            \"options\": \"1.否 2.是\",\n            \"has_additional\": True,\n            \"additional_condition\"\
        : 2,\n            \"additional_question\": \"额外问题（得分等于2时）：该学生因父母健康问题而影响了他/她在学校的行为的原因是？\"\n        },\n        {\n\
        \            \"title\": \"- 该学生是否因父母争吵问题而影响了他/她在学校的行为？\",\n            \"options\": \"1.否 2.是\",\n            \"has_additional\"\
        : True,\n            \"additional_condition\": 2,\n            \"additional_question\": \"额外问题（得分等于2时）：该学生因父母争吵问题而影响了他/她在学校的行为的原因是？\"\
        \n        },\n        {\n            \"title\": \"- 该学生是否因兄弟姐妹问题而影响了他/她在学校的行为？\",\n            \"options\": \"1.否\
        \ 2.是\",\n            \"has_additional\": True,\n            \"additional_condition\": 2,\n            \"additional_question\"\
        : \"额外问题（得分等于2时）：该学生因兄弟姐妹问题而影响了他/她在学校的行为的原因是？\"\n        },\n        {\n            \"title\": \"- 该学生在服用什么药物？你认为这在多大程度上是正确的药物，会影响这个孩子的行为吗？\"\
        ,\n            \"options\": \"1.该学生没有服用药物 2.行为更糟 3.有点更糟 4.无效 5.有点改善 6.有效改善\",\n            \"has_additional\": True,\n\
        \            \"additional_condition\": 2,\n            \"additional_question\": \"额外问题（得分大于等于2时）：该学生在服用什么药物？\"\n \
        \       }\n    ]\n    \n    # 根据bg_2调用指定的题目\n    for i, question_key in enumerate(['question_1', 'question_2']):\n\
        \        # 获取题目编号\n        question_num = bg_2[i]\n        \n        # 如果 bg_2 对应位置为 0，question 为空\n        if question_num\
        \ == 0:\n            output_object[question_key] = \"\"\n            continue\n        \n        # 转换为索引（bg_2中的值是1-11，需要转换为索引0-10）\n\
        \        question_index = question_num - 1\n        \n        # 确保索引在有效范围内\n        if question_index < 0 or question_index\
        \ >= 11:\n            output_object[question_key] = \"\"\n            continue\n        \n        question = questions[question_index]\n\
        \        score = scores[question_index]\n        \n        # 构建题目内容\n        question_content = f\"{question['title']}\\\
        n{question['options']}\"\n        \n        # 如果该题目已有得分，显示得分\n        if score > 0:\n            question_content\
        \ += f\"\\n当前得分：{score}\"\n        \n        # 如果有额外问题，添加额外问题部分\n        if question[\"has_additional\"]:\n      \
        \      question_content += f\"\\n\\n{question['additional_question']}\"\n            \n            # 如果已有得分且满足额外问题条件，提示需要填写额外问题\n\
        \            if score > 0 and score >= question[\"additional_condition\"]:\n                question_content += \"\
        \\n——此额外问题需要填写\"\n        \n        output_object[question_key] = question_content\n    \n    return output_object\n\
        \n\n"
