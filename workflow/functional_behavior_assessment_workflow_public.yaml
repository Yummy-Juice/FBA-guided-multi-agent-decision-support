  - id: node_025
    type: code
    name: 背景字符串转列表
    inputs:
    - name: bg_score
      type: string
      required: true
    - name: bg_add
      type: string
      required: true
    - name: bg_2
      type: string
      required: true
    outputs:
    - name: bg_score_list
      type: list
      required: false
    - name: bg_add_list
      type: list
      required: false
    - name: bg_2_list
      type: list
      required: false
    settings:
      code: "import json\n\ndef main(params):\n    # ① 默认值\n    default_bg_score = [0] * 11\n    default_bg_add   = [\"\"\
        ] * 8\n    default_bg_2 = [1, 2]\n\n    # ② 取入参\n    bg_score_str = params.get('bg_score', '')\n    bg_add_str   =\
        \ params.get('bg_add', '')\n    bg_2_str = params.get('bg_2', '')\n\n    # ③ 尝试转换 bg_score，如果失败或不符合要求就用默认值\n    try:\n\
        \        bg_score_list = json.loads(bg_score_str)\n        # 必须是列表且长度为 11\n        if not isinstance(bg_score_list,\
        \ list) or len(bg_score_list) != 11:\n            raise ValueError(\"bg_score length error\")\n        # 尝试转为 int\n\
        \        bg_score_list = [int(x) for x in bg_score_list]\n    except Exception:\n        bg_score_list = default_bg_score\n\
        \n    # ④ 尝试转换 bg_add，如果失败或不符合要求就用默认值\n    try:\n        bg_add_list = json.loads(bg_add_str)\n        # 必须是列表且长度为\
        \ 8\n        if not isinstance(bg_add_list, list) or len(bg_add_list) != 8:\n            raise ValueError(\"bg_add\
        \ length error\")\n        # 统一转为字符串\n        bg_add_list = [str(x) for x in bg_add_list]\n    except Exception:\n\
        \        bg_add_list = default_bg_add\n\n    # ③ 尝试转换 bg_2，如果失败或不符合要求就用默认值\n    try:\n        bg_2_list = json.loads(bg_2_str)\n\
        \        # 必须是列表\n        if not isinstance(bg_2_list, list):\n            raise ValueError(\"bg_2 length error\"\
        )\n        # 尝试转为 int\n        bg_2_list = [int(x) for x in bg_2_list]\n    except Exception:\n        bg_2_list =\
        \ default_bg_2\n\n    # ⑤ 组织输出\n    output_object = {\n        \"bg_score_list\": bg_score_list,  # 11 个整数\n     \
        \   \"bg_add_list\": bg_add_list,       # 8 个字符串\n        \"bg_2_list\": bg_2_list    # 2 个整数\n    }\n    return output_object"
      language: Python
