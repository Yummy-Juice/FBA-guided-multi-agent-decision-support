        \ 3偶尔 4经常 5总是\",\n            \"has_additional\": True,\n            \"additional_condition\": 3,\n            \"\
        additional_question\": \"额外问题（得分大于等于3时）：该学生会使用哪些积极策略来让同伴知道他/她想要独处？\",\n            \"additional_index\": 5\n     \
        \   }\n    ]\n    \n    # 统计未填写的题目数量\n    unfilled_count = 0\n    for i in range(9):\n        question = questions[i]\n\
        \        score = scores[i]\n        \n        # 判断题目是否未填写\n        is_unfilled = False\n        \n        if score\
        \ == 0:\n            # 主问题没有得分\n            is_unfilled = True\n        elif question[\"has_additional\"] and score\
        \ >= question[\"additional_condition\"]:\n            # 主问题有得分且满足额外问题条件，但额外问题未填写\n            if not po_add[question[\"\
        additional_index\"]]:\n                is_unfilled = True\n        \n        if is_unfilled:\n            unfilled_count\
        \ += 1\n    \n    # 根据po_2调用指定的题目\n    for i, question_key in enumerate(['question_1', 'question_2']):\n        #\
        \ 获取题目编号（po_2中的值是1-9，需要转换为索引0-8）\n        question_index = po_2[i] - 1\n        \n        # 确保索引在有效范围内\n        if\
        \ question_index < 0 or question_index >= 9:\n            output_object[question_key] = \"\"\n            continue\n\
        \        \n        question = questions[question_index]\n        score = scores[question_index]\n        \n      \
        \  # 判断该题目是否已完全填写\n        is_filled = False\n        if score > 0:\n            if question[\"has_additional\"] and\
        \ score >= question[\"additional_condition\"]:\n                # 需要额外答案\n                if po_add[question[\"additional_index\"\
        ]]:\n                    is_filled = True\n            else:\n                # 不需要额外答案\n                is_filled\
        \ = True\n        \n        # 如果题目已完全填写，输出空字符串\n        if is_filled:\n            output_object[question_key] = \"\
        \"\n            continue\n        \n        # 构建题目内容（仅当题目未完全填写时）\n        question_content = f\"{question['title']}\\\
        n{question['options']}\"\n        \n        # 如果该题目已有得分，显示得分\n        if score > 0:\n            question_content\
        \ += f\"\\n当前得分：{score}\"\n        \n        # 如果有额外问题，添加额外问题部分\n        if question[\"has_additional\"]:\n      \
        \      question_content += f\"\\n\\n{question['additional_question']}\"\n            \n            # 如果已有得分且满足额外问题条件，提示需要填写额外问题\n\
        \            if score > 0 and score >= question[\"additional_condition\"]:\n                question_content += \"\
        \\n【此额外问题需要填写】\"\n        \n        output_object[question_key] = question_content\n    \n    # 设置未填写题目数量\n    output_object[\"\
        unfilled_number\"] = unfilled_count\n    \n    return output_object\n"
