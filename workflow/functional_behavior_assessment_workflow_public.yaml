      type: string
      required: true
    outputs:
    - name: question_1
      type: string
      required: false
    - name: question_2
      type: string
      required: false
    settings:
      code: "import json\n\ndef main(params):\n    # 创建一个字典作为输出变量\n    output_object = {\n        \"question_1\": \"\",\n\
        \        \"question_2\": \"\"\n    }\n    \n    # 获取输入数据\n    scores = params.get('po_score', [])\n    # 确保scores数组至少有9个元素，不足的用0补充\n\
        \    while len(scores) < 9:\n        scores.append(0)\n    \n    # ① 默认值\n    default_po_2 = [1, 2]  # 改为 [1, 2] 更合理\n\
        \n    # ② 取入参\n    po_2_raw = params.get('po_2', '')\n\n    # ③ 尝试转换 po_2\n    try:\n        # 如果 po_2 已经是列表，直接使用\n\
        \        if isinstance(po_2_raw, list):\n            po_2 = [int(x) for x in po_2_raw]\n        # 如果是字符串，尝试 JSON 解析\n\
        \        elif isinstance(po_2_raw, str) and po_2_raw:\n            po_2 = json.loads(po_2_raw)\n            if not\
        \ isinstance(po_2, list):\n                raise ValueError(\"po_2 must be a list\")\n            po_2 = [int(x) for\
        \ x in po_2]\n        else:\n            po_2 = default_po_2\n    except Exception:\n        po_2 = default_po_2\n\
        \n    # 确保po_2至少有2个元素\n    while len(po_2) < 2:\n        po_2.append(1)\n    \n    # 定义所有问题的模板\n    questions = [\n\
        \        {\n            \"title\": \"- 该学生更喜欢和别人一起玩多于独自玩吗？\",\n            \"options\": \"1.非常少 2.有点少 3.差不多 4.有点多\
        \ 5.非常多\",\n            \"has_additional\": False,\n            \"additional_condition\": None,\n            \"additional_question\"\
        : \"\"\n        },\n        {\n            \"title\": \"- 相比大多数孩子，其他同学是否经常地邀请跟该学生玩耍、游戏？\",\n            \"options\"\
        : \"1.非常少 2.有点少 3.差不多 4.有点多 5.非常多\",\n            \"has_additional\": False,\n            \"additional_condition\"\
        : None,\n            \"additional_question\": \"\"\n        },\n        {\n            \"title\": \"- 相比大多数孩子，其他同学经常邀请该学生参与团体活动？\"\
        ,\n            \"options\": \"1.非常少 2.有点少 3.差不多 4.有点多 5.非常多\",\n            \"has_additional\": False,\n         \
        \   \"additional_condition\": None,\n            \"additional_question\": \"\"\n        },\n        {\n          \
        \  \"title\": \"- 该学生使用积极策略来引起您的注意的频率有多大？\",\n            \"options\": \"1.从不 2.很少 3.偶尔 4.经常 5.总是\",\n           \
        \ \"has_additional\": True,\n            \"additional_condition\": 3,\n            \"additional_question\": \"额外问题（得分大于等于3时）：该学生会使用哪些积极策略来引起您的注意？\"\
        \n        },\n        {\n            \"title\": \"- 该学生使用积极策略来引起同伴的注意的频率有多大？\",\n            \"options\": \"1.从不 2.很少\
        \ 3.偶尔 4.经常 5.总是\",\n            \"has_additional\": True,\n            \"additional_condition\": 3,\n           \
        \ \"additional_question\": \"额外问题（得分大于等于3时）：该学生会使用哪些积极策略来引起同伴的注意？\"\n        },\n        {\n            \"title\"\
        : \"- 该学生使用积极策略来让您知道他/她需要休息的频率有多大？\",\n            \"options\": \"1.从不 2.很少 3.偶尔 4.经常 5.总是\",\n            \"has_additional\"\
        : True,\n            \"additional_condition\": 3,\n            \"additional_question\": \"额外问题（得分大于等于3时）：该学生会使用哪些积极策略来让您知道他/她需要休息？\"\
        \n        },\n        {\n            \"title\": \"- 该学生使用积极策略来让您知道他/她想要参与喜欢的活动或玩某个东西的频率有多大？\",\n            \"options\"\
        : \"1.从不 2.很少 3.偶尔 4.经常 5.总是\",\n            \"has_additional\": True,\n            \"additional_condition\": 3,\n\
        \            \"additional_question\": \"额外问题（得分大于等于3时）：该学生会使用哪些积极策略来让您知道他/她想要参与喜欢的活动或玩某个东西？\"\n        },\n      \
        \  {\n            \"title\": \"- 该学生使用积极策略来让您知道他/她想要自己平静一下的频率有多大？\",\n            \"options\": \"1.从不 2.很少 3.偶尔 4.经常\
        \ 5.总是\",\n            \"has_additional\": True,\n            \"additional_condition\": 3,\n            \"additional_question\"\
        : \"额外问题（得分大于等于3时）：该学生会使用哪些积极策略来让您知道他/她想要自己平静一下？\"\n        },\n        {\n            \"title\": \"- 该学生使用积极策略来让同伴知道他/她想要独处？\"\
        ,\n            \"options\": \"1.从不 2.很少 3.偶尔 4.经常 5.总是\",\n            \"has_additional\": True,\n            \"additional_condition\"\
        : 3,\n            \"additional_question\": \"额外问题（得分大于等于3时）：该学生会使用哪些积极策略来让同伴知道他/她想要独处？\"\n        }\n    ]\n    \n\
        \    # 根据po_2调用指定的题目\n    for i, question_key in enumerate(['question_1', 'question_2']):\n        # 获取题目编号\n    \
        \    question_num = po_2[i]\n        \n        # 如果po_2对应位置为0，question为空\n        if question_num == 0:\n        \
        \    output_object[question_key] = \"\"\n            continue\n        \n        # 将题目编号转换为索引（po_2中的值是1-9，需要转换为索引0-8）\n\
        \        question_index = question_num - 1\n        \n        # 确保索引在有效范围内\n        if question_index < 0 or question_index\
        \ >= 9:\n            output_object[question_key] = \"\"\n            continue\n        \n        question = questions[question_index]\n\
        \        score = scores[question_index]\n        \n        # 构建题目内容\n        question_content = f\"{question['title']}\\\
        n{question['options']}\"\n        \n        # 如果该题目已有得分，显示得分\n        if score > 0:\n            question_content\
        \ += f\"\\n当前得分：{score}\"\n        \n        # 如果有额外问题，添加额外问题部分\n        if question[\"has_additional\"]:\n      \
        \      question_content += f\"\\n\\n{question['additional_question']}\"\n            \n            # 如果已有得分且满足额外问题条件，提示需要填写额外问题\n\
        \            if score > 0 and score >= question[\"additional_condition\"]:\n                question_content += \"\
        \\n【此额外问题需要填写】\"\n        \n        output_object[question_key] = question_content\n    \n    return output_object\n\
        \n"
      language: Python
  - id: node_072
