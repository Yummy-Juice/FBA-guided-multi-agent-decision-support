        \ while len(re_2) < 2:\n        re_2.append(1)\n    \n    # 定义所有问题的模板\n    questions = [\n        {\n            \"\
        title\": \"当只有其他孩子在场时，问题行为发生的可能性有多大？\",\n            \"options\": \"1不太可能 2有点可能 3有可能 4很有可能 5非常可能\",\n            \"\
