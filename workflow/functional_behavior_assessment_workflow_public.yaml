        \ po_filled_list = []\n    po_unfilled_list = []\n    \n    for i in range(9):\n        question = po_questions[i]\n\
        \        score = po_scores[i]\n        \n        # 判断问题是否完全填写\n        is_filled = False\n        \n        if score\
