      multimodal_model: false
      prompt: '以下是另一个FBA指导的教育决策支持助手正在系统化的向老师收集一位问题学生的信息，以分析他产生问题行为的成因与功能。 现在他们进入到了“社交技能与积极策略”阶段，在该阶段下你需要评估学生的社交能力及积极行为模式。请根据FBA指导的教育决策支持助手与老师的访谈记录，判断访谈中是否涉及到了以下社交技能与积极策略问题，如果有涉及，请你根据其描述的情况打分。若题目存在额外问题，你还要收集额外问题的答案。


