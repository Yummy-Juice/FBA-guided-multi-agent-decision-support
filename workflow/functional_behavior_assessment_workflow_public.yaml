        : \"该学生因父母健康问题而影响了他/她在学校的行为的原因是{}\"\n        },\n        {\n            \"title\": \"该学生是否因父母争吵问题而影响了他/她在学校的行为\",\n\
        \            \"options\": [\"否\", \"是\"],\n            \"has_additional\": True,\n            \"additional_condition\"\
        : 2,\n            \"additional_index\": 5,\n            \"additional_template\": \"该学生因父母争吵问题而影响了他/她在学校的行为的原因是{}\"\
        \n        },\n        {\n            \"title\": \"该学生是否因兄弟姐妹问题而影响了他/她在学校的行为\",\n            \"options\": [\"否\", \"\
        是\"],\n            \"has_additional\": True,\n            \"additional_condition\": 2,\n            \"additional_index\"\
        : 6,\n            \"additional_template\": \"该学生因兄弟姐妹问题而影响了他/她在学校的行为的原因是{}\"\n        },\n        {\n            \"\
