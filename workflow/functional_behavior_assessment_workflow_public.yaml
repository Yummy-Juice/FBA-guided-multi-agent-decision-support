    settings:
      code: "import json\n\ndef main(params):\n    # 创建一个字典作为输出变量\n    output_object = {\n        # 将所有输入参数转换为JSON格式字符串\n\
        \        \"json_result\": json.dumps(params, ensure_ascii=False, indent=2)\n    }\n    \n    # 返回输出字典\n    return\
        \ output_object\n"
      language: Python
  - id: node_012
    type: code
    name: 基本信息阶段判断
    inputs:
    - name: gender
      type: string
      required: true
    - name: age
      type: number
      required: true
    - name: diagnosis_report
      type: string
      required: true
    - name: trigger_situation
      type: string
      required: true
    - name: behavior
      type: string
      required: true
    - name: frequency
      type: string
      required: true
    outputs:
    - name: stage
      type: number
      required: false
    settings:
      code: "def main(params):\n    # 创建一个字典作为输出变量\n    output_object = {\n        \"stage\": 0  # 默认为0\n    }\n    \n   \
        \ # 获取6个独立变量\n    gender = params.get('gender', '')\n    age = params.get('age', 0)\n    diagnosis_report = params.get('diagnosis_report',\
        \ '')\n    trigger_situation = params.get('trigger_situation', '')\n    behavior = params.get('behavior', '')\n  \
        \  frequency = params.get('frequency', '')\n    \n    # 检查条件：\n    # 1. 第1、3到6个变量均不为空字符串（gender, diagnosis_report,\
        \ trigger_situation, behavior, frequency）\n    # 2. 第2个变量的值大于等于0（age >= 0）\n    if (gender != '' and \n        diagnosis_report\
        \ != '' and \n        trigger_situation != '' and \n        behavior != '' and \n        frequency != '' and \n  \
        \      age > 0):\n        output_object[\"stage\"] = 1\n    \n    return output_object\n\n"
      language: Python
