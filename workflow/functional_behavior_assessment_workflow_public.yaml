        : 3,\n            \"additional_template\": \"该学生因遭受虐待而影响了他/她在学校的行为的原因是{}\"\n        },\n        {\n            \"\
        title\": \"该学生是否因父母健康问题而影响了他/她在学校的行为\",\n            \"options\": [\"否\", \"是\"],\n            \"has_additional\"\
