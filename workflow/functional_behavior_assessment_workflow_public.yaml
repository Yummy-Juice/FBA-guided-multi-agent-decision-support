        \ = params.get('additional_2', '')\n    \n    # 获取当前的po_score和po_add\n    po_score = params.get('po_score', [])\n\
        \    po_add = params.get('po_add', [])\n    \n    # 确保po_score至少有9个元素\n    while len(po_score) < 9:\n        po_score.append(0)\n\
