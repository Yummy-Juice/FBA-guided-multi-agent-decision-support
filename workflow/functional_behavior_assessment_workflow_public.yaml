  - id: node_037
    type: code
    name: AI回复
    inputs:
    - name: history
      type: string
      required: true
    - name: user_input
      type: string
      required: true
    outputs:
    - name: assistant_input
      type: string
      required: false
    - name: conversation
      type: string
      required: false
    settings:
      code: "def main(params):\n    # 创建一个字典作为输出变量\n    output_object = {\n        \"conversation\": \"\",\n        \"assistant_input\"\
        : \"\"\n    }\n    \n    # 获取输入的两个字符串变量\n    user_input = params.get('user_input', '')\n    history = params.get('history',\
        \ '')\n    \n    # 提取Assistant的最后一句发言（从原history中提取）\n    if history:\n        # 分割历史对话,找到所有Assistant的发言\n        #\
        \ 使用\"Assistant：\"作为分隔符\n        parts = history.split('Assistant：')\n        \n        # 如果存在Assistant的发言(parts长度大于1)\n\
        \        if len(parts) > 1:\n            # 获取最后一个Assistant发言部分\n            last_assistant_part = parts[-1]\n    \
        \        \n            # 去除可能存在的后续User发言\n            # 如果后面还有\"User：\",则只取到\"User：\"之前的内容\n            if 'User：'\
        \ in last_assistant_part:\n                assistant_input = last_assistant_part.split('User：')[0].strip()\n     \
        \       else:\n                assistant_input = last_assistant_part.strip()\n            \n            output_object[\"\
        assistant_input\"] = assistant_input\n        else:\n            # 如果没有找到Assistant的发言,返回空字符串\n            output_object[\"\
        assistant_input\"] = \"\"\n    else:\n        # 如果history为空,返回空字符串\n        output_object[\"assistant_input\"] = \"\
        \"\n    \n    # 将历史对话中的User和Assistant替换为老师和FBA指导的教育决策支持助手\n    if history:\n        # 替换历史对话中的角色名称\n        formatted_history\
        \ = history.replace('User：', '老师：').replace('Assistant：', 'FBA指导的教育决策支持助手：')\n        # 在末尾添加新的老师发言\n        conversation\
        \ = formatted_history + f\"\\n\\n老师：{user_input}\"\n    else:\n        # 如果没有历史对话，直接创建新的老师发言\n        conversation\
        \ = f\"老师：{user_input}\"\n    \n    output_object[\"conversation\"] = conversation\n    \n    return output_object\n"
      language: Python
