        \                # 检查更新后的po_score对应位置是否不为0\n                if new_po_score[question_1_num - 1] != 0:\n          \
        \          if not is_blank(additional_1):\n                        new_po_add[add_index] = additional_1\n    \n  \
        \  # 更新问题2的数据\n    question_2_num = po_2[1]\n    if 1 <= question_2_num <= 9:\n        # 大于0的score覆盖任意po_score；等于0的score无法覆盖\n\
        \        if score_2 > 0:\n            new_po_score[question_2_num - 1] = score_2\n            \n            # 若该题有额外问题：只有当更新后po_score对应位置不为0时，才更新额外字段\n\
        \            if question_2_num in question_to_add_index:\n                add_index = question_to_add_index[question_2_num]\n\
        \                # 检查更新后的po_score对应位置是否不为0\n                if new_po_score[question_2_num - 1] != 0:\n          \
        \          if not is_blank(additional_2):\n                        new_po_add[add_index] = additional_2\n    \n  \
        \  # 输出更新后的数据（数组形式）\n    output_object[\"po_score\"] = new_po_score\n    output_object[\"po_add\"] = new_po_add\n\
        \    \n    # 将更新后的数据转换为字符串\n    import json\n    output_object[\"po_score_str\"] = json.dumps(new_po_score, ensure_ascii=False)\n\
        \    output_object[\"po_add_str\"] = json.dumps(new_po_add, ensure_ascii=False)\n    \n    return output_object\n"
